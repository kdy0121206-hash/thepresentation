<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLIND WALK 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Noto Sans KR', sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* UI 공통 */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.85); color: #fff; z-index: 10; text-align: center; padding: 20px; box-sizing: border-box; }
        h1 { font-size: 3rem; margin-bottom: 10px; text-shadow: 0 0 10px rgba(0,255,255,0.5); }
        h2 { font-size: 1.5rem; margin-bottom: 30px; font-weight: 300; color: #aaa; }
        p { font-size: 1.2rem; line-height: 1.6; margin-bottom: 40px; max-width: 600px; word-break: keep-all; }
        
        /* START 버튼 */
        .primary-btn { padding: 15px 40px; font-size: 1.2rem; cursor: pointer; background: transparent; color: #0ff; border: 2px solid #0ff; border-radius: 5px; transition: all 0.3s ease; text-transform: uppercase; font-weight: bold; margin-bottom: 20px; }
        .primary-btn:hover { background: #0ff; color: #000; box-shadow: 0 0 15px #0ff; }

        /* HUD */
        #hud { position: absolute; top: 20px; left: 20px; color: #fff; z-index: 5; pointer-events: none; }
        .hud-item { margin-bottom: 10px; font-size: 0.9rem; opacity: 0.8; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 50%; transform: translate(-50%, -50%); z-index: 5; pointer-events: none; }
        
        /* 모바일 컨트롤러 */
        #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; z-index: 5; display: none; touch-action: none; }
        #joystick-knob { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(0,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #touch-pad { position: absolute; top: 0; right: 0; width: 50%; height: 100%; z-index: 4; display: none; touch-action: none; }
        
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-item" id="hud-move">W,A,S,D : 이동 (터치하면 자동 전환)</div>
        <div class="hud-item" id="hud-look">마우스 : 시점 및 지팡이 조작</div>
    </div>
    <div id="crosshair"></div>

    <!-- 모바일 컨트롤 (버튼 없이 터치 시 자동 활성화) -->
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="touch-pad"></div>

    <!-- 시작 화면 -->
    <div id="start-screen" class="overlay">
        <h1>BLIND WALK 3D</h1>
        <h2>Explore the world through a white cane.</h2>
        <p>당신은 지금 시각적 정보가 제한된 환경에서 길을 찾아야 합니다.<br>흰 지팡이를 움직여 주변 장애물과 구조물을 파악하세요.</p>
        <button id="start-btn" class="primary-btn">START</button>
    </div>

    <!-- 종료/일시정지 화면 -->
    <div id="end-screen" class="overlay" style="display: none;">
        <h1>탐색 일시정지</h1>
        <p>"당신은 주변의 모든 장애물을 발견했나요?"</p>
        <button id="resume-btn" class="primary-btn">계속하기</button>
        <button id="restart-btn" class="primary-btn" style="margin-bottom: 20px;">처음부터 재시작</button>
    </div>

    <!-- Three.js 라이브러리 -->
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js';
        import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/postprocessing/RenderPass.js';
        import { OutlinePass } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/postprocessing/OutlinePass.js';

        // 1. 기본 설정
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.Fog(0x050505, 2, 15);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.6, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // 2. 후처리
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const outlinePass = new OutlinePass(new THREE.Vector2(window.innerWidth, window.innerHeight), scene, camera);
        outlinePass.edgeStrength = 5.0; 
        outlinePass.edgeGlow = 1.0;     
        outlinePass.edgeThickness = 2.0; 
        outlinePass.visibleEdgeColor.set('#00ffff'); 
        outlinePass.hiddenEdgeColor.set('#005555');
        composer.addPass(outlinePass);

        // 3. 오디오 시스템
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        
        function initAudio() {
            if(!audioCtx) audioCtx = new AudioContext();
            if(audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(material, panX = 0) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const panner = audioCtx.createStereoPanner();
            
            panner.pan.value = Math.max(-1, Math.min(1, panX));

            osc.connect(panner);
            panner.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            
            switch(material) {
                case 'concrete':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(100, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                    break;
                case 'metal':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                    break;
                case 'wood':
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now); osc.stop(now + 0.05);
                    break;
                default:
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
            }
        }

        // 4. 맵 구성
        const interactableObjects = [];

        function createMap() {
            const groundGeo = new THREE.PlaneGeometry(30, 100);
            const groundMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            const sidewalkGeo = new THREE.BoxGeometry(10, 0.1, 100);
            const sidewalkMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
            const sidewalk = new THREE.Mesh(sidewalkGeo, sidewalkMat);
            sidewalk.position.set(5, 0.05, 0);
            scene.add(sidewalk);
            
            const tactileGeo = new THREE.BoxGeometry(0.5, 0.12, 100);
            const tactileMat = new THREE.MeshBasicMaterial({ color: 0x333300 });
            const tactile = new THREE.Mesh(tactileGeo, tactileMat);
            tactile.position.set(5, 0.06, 0);
            tactile.userData = { type: 'tactile', material: 'plastic' };
            scene.add(tactile);
            interactableObjects.push(tactile);

            const createObject = (geo, matColor, x, y, z, type, material) => {
                const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: matColor }));
                mesh.position.set(x, y, z);
                mesh.userData = { type, material, lastTouch: 0 };
                scene.add(mesh);
                interactableObjects.push(mesh);
                return mesh;
            };

            for(let i = -40; i < 40; i+= 10) {
                createObject(new THREE.CylinderGeometry(0.1, 0.1, 4), 0x333333, 2, 2, i, 'streetlight', 'metal');
                if(Math.random() > 0.5) createObject(new THREE.CylinderGeometry(0.4, 0.3, 1), 0x1a1a1a, 8, 0.5, i+2, 'trashcan', 'plastic');
                if(Math.random() > 0.5) createObject(new THREE.BoxGeometry(0.8, 1.2, 0.8), 0x2a1a1a, 3, 0.6, i-3, 'sign', 'wood');
                createObject(new THREE.BoxGeometry(5, 10, 8), 0x151515, 11, 5, i, 'building', 'concrete');
            }
        }
        createMap();

        // 5. 흰 지팡이 로직
        const caneGroup = new THREE.Group();
        scene.add(caneGroup);

        const caneGeo = new THREE.CylinderGeometry(0.015, 0.01, 1.2);
        caneGeo.translate(0, -0.6, 0);
        const caneMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const caneMesh = new THREE.Mesh(caneGeo, caneMat);
        
        const tipGeo = new THREE.SphereGeometry(0.03);
        const tipMat = new THREE.MeshBasicMaterial({ color: 0xff0000, visible: false }); 
        const caneTip = new THREE.Mesh(tipGeo, tipMat);
        caneTip.position.set(0, -1.2, 0);
        
        caneMesh.add(caneTip);
        caneGroup.add(caneMesh);
        
        let caneAngleX = 0; 
        let caneAngleY = 0;
        
        // 6. 컨트롤 로직
        const keys = { w: false, a: false, s: false, d: false };
        let isPlaying = false;
        let isMobile = false; // 터치하면 true로 바뀜
        
        let pitch = 0;
        let yaw = 0;

        // ★ 핵심: 터치 자동 감지 (버튼 클릭할 필요 없음) ★
        window.addEventListener('touchstart', function enableTouchMode() {
            isMobile = true;
            document.getElementById('joystick-zone').style.display = 'block';
            document.getElementById('touch-pad').style.display = 'block';
            document.getElementById('hud-move').innerText = "좌측 조이스틱 : 이동";
            document.getElementById('hud-look').innerText = "우측 화면 : 시점 및 지팡이 조작";
            window.removeEventListener('touchstart', enableTouchMode); // 최초 1회만 작동
        }, { passive: true });

        window.addEventListener('keydown', (e) => {
            if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener('keyup', (e) => {
            if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
        });

        document.addEventListener('mousemove', (e) => {
            if(document.pointerLockElement === document.body && isPlaying && !isMobile) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                caneAngleX = (e.movementX * 0.05) + (Math.sin(performance.now() * 0.005) * 0.3);
                caneAngleY = Math.max(-0.5, Math.min(0.2, (e.movementY * 0.01)));
            }
        });

        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        const touchPad = document.getElementById('touch-pad');
        let joyTouchId = null, padTouchId = null;
        let lastPadX = 0, lastPadY = 0;
        let moveVector = new THREE.Vector2(0, 0);

        joystickZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            joyTouchId = touch.identifier;
            updateJoystick(touch);
        });
        joystickZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === joyTouchId) updateJoystick(e.changedTouches[i]);
            }
        });
        const resetJoystick = () => {
            joyTouchId = null;
            joystickKnob.style.transform = `translate(-50%, -50%)`;
            moveVector.set(0,0);
        };
        joystickZone.addEventListener('touchend', resetJoystick);
        joystickZone.addEventListener('touchcancel', resetJoystick);

        function updateJoystick(touch) {
            const rect = joystickZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const distance = Math.min(rect.width/2, Math.sqrt(dx*dx + dy*dy));
            const angle = Math.atan2(dy, dx);
            
            const knobX = Math.cos(angle) * distance;
            const knobY = Math.sin(angle) * distance;
            
            joystickKnob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;
            moveVector.set(knobX / (rect.width/2), knobY / (rect.height/2));
        }

        touchPad.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            padTouchId = touch.identifier;
            lastPadX = touch.clientX;
            lastPadY = touch.clientY;
        });
        touchPad.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if(!isPlaying) return;
            for(let i=0; i<e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if(touch.identifier === padTouchId) {
                    const movementX = touch.clientX - lastPadX;
                    const movementY = touch.clientY - lastPadY;
                    
                    yaw -= movementX * 0.005;
                    pitch -= movementY * 0.005;
                    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                    caneAngleX = movementX * 0.02;
                    
                    lastPadX = touch.clientX;
                    lastPadY = touch.clientY;
                }
            }
        });
        const resetTouchPad = () => { padTouchId = null; };
        touchPad.addEventListener('touchend', resetTouchPad);
        touchPad.addEventListener('touchcancel', resetTouchPad);

        // 7. UI 로직
        const startScreen = document.getElementById('start-screen');
        const endScreen = document.getElementById('end-screen');

        document.getElementById('start-btn').addEventListener('click', () => {
            initAudio();
            startScreen.style.display = 'none';
            isPlaying = true;
            if(!isMobile && document.body.requestPointerLock) {
                document.body.requestPointerLock();
            }
        });

        document.getElementById('resume-btn').addEventListener('click', () => {
            endScreen.style.display = 'none';
            isPlaying = true;
            if(!isMobile && document.body.requestPointerLock) {
                document.body.requestPointerLock();
            }
        });
        
        document.getElementById('restart-btn').addEventListener('click', () => {
            location.reload();
        });

        document.addEventListener('pointerlockchange', () => {
            if(document.pointerLockElement !== document.body && !isMobile) {
                isPlaying = false;
                if(startScreen.style.display === 'none') endScreen.style.display = 'flex';
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // 8. 렌더 루프
        const clock = new THREE.Clock();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let lastHitTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            if(isPlaying) {
                const delta = clock.getDelta();
                const speed = 3.0; 

                camera.rotation.set(pitch, yaw, 0, 'YXZ');

                direction.z = Number(keys.w) - Number(keys.s) - moveVector.y;
                direction.x = Number(keys.d) - Number(keys.a) + moveVector.x;
                direction.normalize();

                if (direction.z !== 0 || direction.x !== 0) {
                    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                    right.y = 0; right.normalize();
                    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                    forward.y = 0; forward.normalize();

                    velocity.copy(right).multiplyScalar(direction.x)
                            .add(forward.multiplyScalar(-direction.z));
                    
                    camera.position.addScaledVector(velocity, speed * delta);
                }

                camera.position.x = Math.max(0, Math.min(13, camera.position.x));
                camera.position.z = Math.max(-45, Math.min(45, camera.position.z));

                caneGroup.position.copy(camera.position);
                caneGroup.quaternion.copy(camera.quaternion);
                
                caneGroup.translateX(0.3);
                caneGroup.translateY(-0.5);
                caneGroup.translateZ(-0.3);
                
                caneMesh.rotation.x = THREE.MathUtils.lerp(caneMesh.rotation.x, Math.PI / 4 + caneAngleY, 0.1);
                caneMesh.rotation.z = THREE.MathUtils.lerp(caneMesh.rotation.z, Math.sin(performance.now()*0.002)*0.2 + caneAngleX, 0.1);
                
                caneAngleX *= 0.9;
                caneAngleY *= 0.9;

                const tipWorldPos = new THREE.Vector3();
                caneTip.getWorldPosition(tipWorldPos);
                const radius = 0.2; 

                for(let obj of interactableObjects) {
                    const dist = tipWorldPos.distanceTo(obj.position);
                    if(dist < obj.geometry.boundingSphere.radius * obj.scale.x + radius) {
                        obj.userData.lastTouch = performance.now();
                        if(performance.now() - lastHitTime > 250) {
                            const panX = tipWorldPos.clone().project(camera).x;
                            playSound(obj.userData.material, panX);
                            lastHitTime = performance.now();
                        }
                    }
                }

                const selected = [];
                const nowTime = performance.now();
                for(let obj of interactableObjects) {
                    if(nowTime - obj.userData.lastTouch < 200) {
                        selected.push(obj);
                    }
                }
                outlinePass.selectedObjects = selected;
            }
            composer.render();
        }

        interactableObjects.forEach(obj => obj.geometry.computeBoundingSphere());
        animate();
    </script>
</body>
</html>
